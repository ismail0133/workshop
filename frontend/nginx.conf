server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 add_header Cache-Control "no-store" always;
 access_log off;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $auth ${AUTH_UPSTREAM};
 set $payment ${PAYMENT_UPSTREAM};
 proxy_connect_timeout 3s;
 proxy_read_timeout 15s;
 proxy_send_timeout 15s;
 proxy_next_upstream off;
 location = /health { default_type text/plain; return 200 'ok'; }
 location = /status/auth { proxy_pass $auth/health; }
 location = /status/payment { proxy_pass $payment/health/ready; }
 location ~ ^/api/auth/(login|me)$ { proxy_pass $auth$request_uri; }
 location ~ ^/api/(accounts|payments)(/[0-9a-fA-F-]+)?$ { proxy_pass $payment$request_uri; }
 location /api/ { return 404; }
 location /status/ { return 404; }
 location /metrics { return 404; }
 location /internal/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
