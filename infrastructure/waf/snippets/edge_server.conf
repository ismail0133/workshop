# Shared by the HTTP (8080) and HTTPS (8443) servers.

# ---- Edge policy (rewrite phase, evaluated before any location) --------------
if ($is_blocked) { return 403; }
if ($request_method !~ ^(GET|POST)$) { return 405; }

client_max_body_size 16k;        # backend refuses > 16384 bytes anyway
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          15s;
large_client_header_buffers 4 8k;

limit_req  zone=edge_global burst=400 nodelay;
limit_conn edge_conn 100;

error_page 403 @edge_blocked;
error_page 405 @edge_method;
error_page 413 @edge_toolarge;
error_page 429 @edge_ratelimited;
error_page 502 503 504 @edge_unavailable;

location @edge_blocked {
    add_header X-Edge-Action blocked always;
    return 403 '{"code":"EDGE_BLOCKED","message":"Source blocked by edge policy"}';
}
location @edge_method {
    return 405 '{"code":"METHOD_NOT_ALLOWED","message":"Method not allowed"}';
}
location @edge_toolarge {
    return 413 '{"code":"BODY_TOO_LARGE","message":"Request body too large"}';
}
location @edge_ratelimited {
    add_header Retry-After 5 always;
    add_header X-Edge-Action rate-limited always;
    return 429 '{"code":"RATE_LIMITED","message":"Too many requests"}';
}
location @edge_unavailable {
    add_header Retry-After 2 always;
    return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"Service temporarily unavailable"}';
}

# ---- Edge-local health (does not touch the backends) -------------------------
location = /edge/health {
    access_log off;
    return 200 '{"status":"ok","service":"waf"}';
}

# ---- Internal surfaces: never reachable from outside -------------------------
# (exact /health/ready is declared below and wins over this regex)
location ~* ^/(metrics|docs|redoc|openapi\.json|health|ready|live)(/|$) {
    return 404 '{"code":"NOT_FOUND","message":"Not found"}';
}

# ---- Readiness relayed for the Recovery Validator ----------------------------
location = /health/ready {
    set $upstream_payment payment-api:8000;
    include /etc/nginx/snippets/proxy_common.conf;
    proxy_pass http://$upstream_payment;
}

# ---- Auth service ------------------------------------------------------------
# Strict per-IP limit on login (the backend limiter only sees the proxy IP).
location = /api/auth/login {
    limit_req zone=edge_global burst=400 nodelay;
    limit_req zone=edge_login  burst=5   nodelay;
    set $upstream_auth auth-service:8001;
    include /etc/nginx/snippets/proxy_common.conf;
    proxy_pass http://$upstream_auth;
}

location = /api/auth/me {
    set $upstream_auth auth-service:8001;
    include /etc/nginx/snippets/proxy_common.conf;
    proxy_pass http://$upstream_auth;
}

# ---- Payment API: same route whitelist as the frontend's own Nginx -----------
location ~ ^/api/(accounts|payments)(/[0-9a-fA-F-]+)?$ {
    set $upstream_payment payment-api:8000;
    include /etc/nginx/snippets/proxy_common.conf;
    proxy_pass http://$upstream_payment;
}

# Any other /api path: not exposed. (No ^~ here, so the regexes above win.)
location /api/ {
    return 404 '{"code":"NOT_FOUND","message":"Not found"}';
}

# ---- Everything else = the React app served by the frontend container --------
# (/status/auth and /status/payment, used by the Infrastructure page, go there too)
location / {
    set $upstream_frontend frontend:8080;
    include /etc/nginx/snippets/proxy_common.conf;
    proxy_pass http://$upstream_frontend;
}
